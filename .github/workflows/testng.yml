name: Java CI with Maven and TestNG

on:
  push:
    branches:
      - main
      - test
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build and test with Maven
        run: mvn -X clean test
        
      - name: Run tests with TestNG
        run: mvn clean test -DsuiteXmlFile=testng.xml
        - name: Show Maven build output
        run: |
        mvn clean install
        cat target/test-classes/org/testng/testng-results.xml


